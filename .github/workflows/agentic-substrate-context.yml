name: Agentic Substrate Context

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.serena/project.yml'
      - '.serena/memories/project-context.md'
      - 'docs/agentic-substrate-current-handoff.md'
      - 'docs/agentic-substrate-project-state.json'
      - 'docs/agentic-substrate-codebase-study.md'
      - 'docs/agentic-substrate-kernel-contracts.md'
      - 'docs/agentic-substrate-lab-location.md'
      - 'docs/agentic-substrate-runtime-cut.md'
      - 'docs/agentic-substrate-s1-implementation-plan.md'
      - 'docs/healthcare-system-design-mvp.html'
      - 'docs/agentic-substrate-experiment-queue.md'
      - 'docs/agentic-substrate-lab-handoff.md'
      - 'docs/healthcare-prototype-roadmap.md'
      - 'scripts/check-agentic-substrate-context.mjs'
      - 'scripts/agentic-substrate-context-render.mjs'
      - '.github/workflows/agentic-substrate-context.yml'
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - '.serena/project.yml'
      - '.serena/memories/project-context.md'
      - 'docs/agentic-substrate-current-handoff.md'
      - 'docs/agentic-substrate-project-state.json'
      - 'docs/agentic-substrate-codebase-study.md'
      - 'docs/agentic-substrate-kernel-contracts.md'
      - 'docs/agentic-substrate-lab-location.md'
      - 'docs/agentic-substrate-runtime-cut.md'
      - 'docs/agentic-substrate-s1-implementation-plan.md'
      - 'docs/healthcare-system-design-mvp.html'
      - 'docs/agentic-substrate-experiment-queue.md'
      - 'docs/agentic-substrate-lab-handoff.md'
      - 'docs/healthcare-prototype-roadmap.md'
      - 'scripts/check-agentic-substrate-context.mjs'
      - 'scripts/agentic-substrate-context-render.mjs'
      - '.github/workflows/agentic-substrate-context.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify context (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify canonical context
        run: node scripts/check-agentic-substrate-context.mjs
